name: Legacy Endpoint Guard

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: true
      - name: Check legacy endpoints
        run: pnpm endpoints:guard

