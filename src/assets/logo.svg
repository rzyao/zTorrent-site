<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">     <!-- 背景底色，使用较深的橙色调（#e07100）作为阴影。半径增大至 28，使其底部达到 y=60 的边界。 -->     <circle cx="30" cy="32" r="28" fill="#e07100" />     <!-- 苹果主体，应用新的橙色渐变。rx=28, ry=27，使其宽度和高度几乎占满整个视图。 -->     <ellipse cx="30" cy="32" rx="28" ry="27" fill="url(#appleGradient)" />     <!-- 苹果柄，保持原有的棕色。位置已向上调整，以适应更大的苹果。 -->     <path d="M30 6 Q32 2, 34 4 Q36 6, 34 8" stroke="#8B4513" stroke-width="2" fill="none" />     <!-- 高光，保持白色透明度以增加光泽感。已将透明度从 0.3 提高到 0.6，使其更白更亮。 -->     <ellipse cx="26" cy="28" rx="4" ry="5" fill="rgba(255,255,255,0.6)" />     <!-- 叶子，已放大。路径坐标已调整以增大叶子的尺寸。 -->     <path d="M32 6 L37 1 Q39 -1, 42 1 L42 6 Q39 4, 37 6 Z" fill="#22C55E" />          <defs>         <!-- 橙色渐变定义，增强立体感。从左上到右下 (5, 5 to 55, 55)。增加了渐变阶梯以实现更平滑的过渡。 -->         <linearGradient id="appleGradient" x1="5" y1="5" x2="55" y2="55" gradientUnits="userSpaceOnUse">             <!-- 极亮高光区 -->             <stop offset="0%" stop-color="#ffaf5c" />              <!-- 亮部过渡 -->             <stop offset="15%" stop-color="#ff912a" />             <!-- 中间主色调 -->             <stop offset="45%" stop-color="#fb7f00" />              <!-- 暗部过渡 -->             <stop offset="75%" stop-color="#d66b00" />             <!-- 阴影主体 -->             <stop offset="95%" stop-color="#a85600" />              <!-- 极暗边缘 -->             <stop offset="100%" stop-color="#854300" />          </linearGradient>     </defs> </svg>